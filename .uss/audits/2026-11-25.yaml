  USS-TST-001:
    result: pass
    evidence: 'CI runs on each pull request and each push to main (.github/workflows/ci.yml:3-6); `cargo xtask check` (:28) runs `cargo test --locked --workspace --all-features` (tools/xtask/src/main.rs:151-156), and a failure exits 1 (main.rs:86, 224). The latest run on main, 45650698265 at f414a61 (2026-11-25), succeeded on ubuntu, windows and macos (`gh api -X GET .../actions/runs?branch=main`).'
  USS-TST-002:
