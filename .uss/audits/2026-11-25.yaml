    evidence: 'rust-toolchain.toml:2-4 pins Rust 1.100.0 with rustfmt, clippy and the wasm32 target; CI installs it from that file (`rustup toolchain install`, .github/workflows/ci.yml:22) and local builds read it through rustup; the other build tool, cargo-deny, is pinned at 0.22.0 (tools/xtask/src/main.rs:7).'
  USS-SUP-002:
