  USS-PRF-001:
    result: fail
    evidence: 'No written performance budget: no document or configuration outside standard/ names a start-up time or other measure with a limit (`git grep -i -E ''budget|benchmark|startup time''` finds only the rule-count budget in tools/uss/src/evaluate/mod.rs:115).'
  USS-PRF-002:
    result: pass
    evidence: 'The project has budgeted no measure (USS-PRF-001 fails), so no budgeted measure is without a CI job; .github/workflows/ci.yml:11-28 has no benchmark job. This pass follows the Verify text, which has nothing to judge when there is no budget.'
  USS-PRF-005:
    result: pass
    evidence: 'uss has no idle state: each command runs to completion and exits (`target/debug/uss.exe check .uss/record.yaml` exits 0 after 158 ms; `uss` with no arguments prints help and exits 2 after 22 ms), so no process stays at rest. Code search for loops: catalog/markdown.rs:260, catalog/mod.rs:543, evaluate/facts.rs:32, expr.rs:177 and :186, source.rs:47, cli/mod.rs:1630 and :1638 (test code); each consumes input or stops at a fixed point, none polls a condition.'
  USS-QLT-008:
    result: pass
    evidence: 'No security rule is off for the whole project: Cargo.toml:13-24 turns no lint off; clippy.toml:1-3 relaxes clippy::unwrap_used, expect_used and panic only in tests, and Clippy has no security group; deny.toml:1-3 keeps the advisories check on with no ignore.'
  USS-RUST-003:
    result: pass
    evidence: 'Cargo.toml:13-14 [workspace.lints.rust] unsafe_code = "forbid"; both crates inherit it with [lints] workspace = true (tools/uss/Cargo.toml:28-29, tools/xtask/Cargo.toml:10-11).'
  USS-RUST-004:
    result: fail
    evidence: 'Cargo.toml has no [profile.release], so overflow-checks keeps its release default false; .cargo/config.toml:1-2 holds only an alias, and .github/workflows/ci.yml sets no CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS.'
  USS-RUST-007:
    result: pass
    evidence: 'rust-toolchain.toml:2 channel = "1.100.0"; :3 components = ["rustfmt", "clippy"], which the CI steps cargo fmt and cargo clippy use (tools/xtask/src/main.rs:134-150); :4 adds the wasm32 target that CI builds.'
  USS-RUST-008:
    result: pass
    evidence: 'Cargo.lock is tracked at the workspace root; the CI step `cargo xtask check` (.github/workflows/ci.yml:28) runs with --locked (.cargo/config.toml:2) and builds and tests with --locked (tools/xtask/src/main.rs:142, 155, 163, 181, 196, 204).'
  USS-RUST-009:
    result: pass
    evidence: 'Every requirement in tools/uss/Cargo.toml:20-26 and :32 is the caret form with an implied bound below the next incompatible version (for example 0.63.0 -> <0.64.0, 4.6 -> <5.0.0); there is no [workspace.dependencies], no target table and no git dependency; tools/xtask/Cargo.toml has none.'
  USS-RUST-010:
    result: fail
    evidence: 'CI runs `cargo-deny check` with no check named (tools/xtask/src/main.rs:123) and fails on a non-zero status (main.rs:86, 224), but deny.toml:1-15 does not include the profile baseline (standard/vendors/embarkstudios/cargo-deny.md:32-55): it lacks advisories.db-urls, advisories.unmaintained = "all", advisories.unused-ignored-advisory = "deny", licenses.unused-license-exception = "deny" and sources.required-git-spec = "rev". Also xtask pins cargo-deny 0.22.0 (main.rs:7), outside the profile''s Versions >=0.22.1.'
  USS-SAF-001:
    result: fail
    evidence: 'The Rust module''s MUST rules that refine USS-SAF-001 are USS-RUST-003 and USS-RUST-004. unsafe_code = "forbid" is on (Cargo.toml:14), but overflow checks are off in release builds: Cargo.toml has no [profile.release] with overflow-checks = true (USS-RUST-004 fails).'
  USS-SEC-002:
    result: pass
    evidence: 'No default turns a security feature off: docs/cli.md:14-20 (no environment variable, no configuration file, no option weakens a check); jsonschema is built without default features, so no remote reference resolution (tools/uss/Cargo.toml:21); `uss show` reads only listed files (tools/uss/src/cli/mod.rs:233-238); record paths never leave the project root (cli/files.rs:73-85).'
  USS-SEC-003:
    result: pass
    evidence: 'The install and run steps need no administrator or root rights: README.md:47-52 and :97-106 install with `cargo install` into the user''s Cargo home; no service definition, container file or installer exists; `git grep -i -E ''sudo|as root|run as administrator''` in the documents, templates, hooks and CI finds nothing.'
  USS-SEC-004:
    result: unverified
    evidence: 'No secret scanner is installed (gitleaks, trufflehog and detect-secrets: command not found), and none may be installed for this audit; GitHub secret scanning is off (`gh api -X GET .../secret-scanning/alerts` -> HTTP 404 ''Secret scanning is disabled on this repository''). A plain regex search of `git log -p --all` for AWS, GitHub, Slack, Google and private-key patterns found nothing, but that is not a secret scan.'
  USS-SEC-005:
    result: fail
    evidence: 'No secret scanner runs in CI: .github/workflows/ci.yml:11-28 has one job, `cargo xtask check`, whose steps are fmt, clippy, test, wasm32 clippy and build, cargo-deny, uss lint and uss check (tools/xtask/src/main.rs:127-213).'
  USS-SEC-009:
    result: fail
    evidence: 'Records and results are checked against schema/record.schema.json and schema/audit-results.schema.json (types, enums, patterns for IDs, dates, versions and the SHA, additionalProperties false), and paths must be plain names (tools/uss/src/cli/files.rs:73-85); but no length is validated: neither schema sets a maxLength (project.name, deviations[].document and approved-by, audits[].results and report, components, auditor, evidence, suppressions), and the files are read whole with no size limit (cli/files.rs:117, cli/mod.rs:348).'
  USS-SEC-010:
    result: pass
    evidence: 'No shell is called: git runs as Command::new("git") with an argument array (tools/uss/src/cli/git.rs:19-34), and the SHA it passes is schema-checked as 40 hex digits; xtask starts programs with argument arrays (tools/xtask/src/main.rs:64-88).'
  USS-SEC-011:
    result: pass
    evidence: 'Untrusted YAML is parsed by serde-saphyr into fixed serde types (tools/uss/src/yaml.rs:17-19): the record is read into serde_json::Value, validated, then into Record (record/mod.rs:171-196); no format or loader that builds arbitrary types is used.'
  USS-SEC-014:
    result: fail
    evidence: 'Report table cells are escaped (tools/uss/src/report.rs:168-179 cell filter), but terminal output is not: check messages write record strings as they are (tools/uss/src/evaluate/check.rs:133, 150, 153; release-check writes git file names, cli/mod.rs:446-449). `uss check` on a copy of the record with deviations[0].document "\e[31mRED\e[0m.md" printed 2 raw ESC bytes to stdout.'
  USS-SEC-028:
    result: fail
    evidence: 'No SAST tool runs in CI: the only job runs Clippy, tests and cargo-deny (tools/xtask/src/main.rs:127-213); the Clippy profile maps no rule to USS-SEC-028 (standard/vendors/rust-lang/clippy.md, Mappings); code scanning is not set up (`gh api -X GET .../code-scanning/alerts` -> HTTP 403 ''Advanced Security must be enabled for this repository'').'
  USS-SEC-029:
    result: pass
    evidence: 'SECURITY.md:3-17 says how to report privately (GitHub private vulnerability reporting) and SECURITY.md:19-29 what happens after a report. Note: `gh api -X GET .../private-vulnerability-reporting` -> HTTP 404, so the named channel is not on yet; SECURITY.md:15-17 gives a fallback.'
  USS-SEC-030:
    result: pass
    evidence: 'SECURITY.md:21-24: acknowledge within 7 days, assess within 14 days, fix or mitigate within 90 days.'
  USS-SEC-031:
    result: pass
    evidence: 'no release yet: `git tag` prints nothing; `gh api -X GET .../releases` and `.../tags` -> HTTP 200 [].'
  USS-SEC-032:
    result: pass
    evidence: 'no release yet: `git tag` prints nothing; `gh api -X GET .../releases` -> HTTP 200 []. (cargo-deny reports no known vulnerability on this commit.)'
