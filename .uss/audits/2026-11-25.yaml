  USS-TST-003:
    result: fail
    evidence: '46 of the 67 commits labelled fix in the window change no test: they change no .rs file, for example 770c0d2, f414a61 and e941126 (fix(standard) text fixes). The before-and-after run of the tests of the 21 code fixes was not done, because these 46 already decide the result.'
  USS-TST-005:
    result: fail
    evidence: 'No test runs the built uss command: no test uses CARGO_BIN_EXE_uss or starts the binary; the CLI tests call the internal function uss::cli::run (tools/uss/src/cli/mod.rs:620 onwards). Documented workflows such as `uss applicable .uss/record.yaml` (README.md:36-38), uss report, uss release-check, uss show and uss export (docs/cli.md:54-115) have no end-to-end test. `cargo xtask check` runs the built uss lint and uss check (tools/xtask/src/main.rs:192-211) only as checks of this repository.'
  USS-TST-010:
