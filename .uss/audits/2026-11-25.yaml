    evidence: 'No automatic mirror: .github/workflows/ci.yml:11-28 has one job (check) and no mirror step; `gh api -X GET repos/HaleTechCo/Universal-Software-Standard/hooks` -> HTTP 200 [] (no webhook); `git remote -v` lists only origin (github.com); no file outside standard/ names a mirror (`git grep -i mirror`: no match). A pull mirror on another host would not show here; the developer''s answers name none.'
  USS-DEP-001:
